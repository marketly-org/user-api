apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-api
  namespace: marketly
  labels:
    app: user-api
    tier: api
  annotations:
    sentinel.io/repo: "marketly-org/user-api"
    sentinel.io/branch: "main"
    sentinel.io/auto-merge: "true"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: user-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: user-api
        tier: api
    spec:
      containers:
        - name: app
          image: ghcr.io/marketly-org/user-api:sha-a5c85e9
          ports:
            - containerPort: 8080
          env:
            - name: USER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: marketly-db-credentials
                  key: users-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: marketly-secrets
                  key: jwt-secret
            - name: PORT
              value: "8080"
            # NOTE: --max-old-space-size is set low to accelerate the
            # memory leak manifestation for testing. In production this
            # would be 512 or higher.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=128"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
